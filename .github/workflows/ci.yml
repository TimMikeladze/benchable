name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The skill ships a bundled CLI; fail if it is stale against src/.
      - run: bun run skill:build && git diff --exit-code skills/
      # The bundle must run under plain Node, which is what agents invoke.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node skills/benchable/scripts/benchable.mjs help
      # The published package is dist/ (ESM + CJS + types); check it resolves everywhere.
      - run: bun run build
      - run: npx -y @arethetypeswrong/cli --pack . --exclude-entrypoints package.json
      - run: node -e "require('benchable'); require('benchable/formats')" && node --input-type=module -e "await import('benchable'); await import('benchable/cli')"
